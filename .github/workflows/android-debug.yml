name: PIXEL RIFT Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Validate and build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Restore Flutter source from starter bundle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import io, tarfile, base64
          encoded = Path(".bootstrap/source.tar.gz.base64").read_text().strip()
          if Path("lib/main.dart").exists():
              print("Using tracked Flutter source")
          else:
              with tarfile.open(fileobj=io.BytesIO(base64.b64decode(encoded)), mode="r:gz") as archive:
                  archive.extractall(".")
              print("Restored Flutter source from starter bundle")
          PY
      - name: Verify 2,300 pixel map
        run: python3 tools/verify_level.py
      - name: Generate original sound effects
        run: python3 tools/generate_sfx.py
      - name: Setup Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android app project
        run: flutter create --platforms=android --org com.pixelrift --project-name pixel_rift .
      - name: Remove Flutter template test
        run: rm -f test/widget_test.dart
      - name: Set visible application name
        run: |
          sed -i 's/android:label="pixel_rift"/android:label="PIXEL RIFT"/' android/app/src/main/AndroidManifest.xml
      - name: Resolve Flutter packages
        run: flutter pub get
      - name: Commit expanded source for normal GitHub editing
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test tools assets pubspec.yaml pubspec.lock analysis_options.yaml .gitignore android
          if ! git diff --cached --quiet; then
            git commit -m "build: expand PIXEL RIFT playable source and Android scaffold"
            git push origin HEAD:main
          else
            echo "No new source changes to commit"
          fi
      - name: Dart static analysis
        run: flutter analyze
      - name: Unit and widget tests
        run: flutter test
      - name: Assemble installable Android debug APK
        run: flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PIXEL-RIFT-Desert-Gate-debug-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
